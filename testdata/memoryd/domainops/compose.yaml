x-world: &world
  build:
    context: ../../..
    dockerfile: test/memoryd/domainops/Dockerfile
    target: world
  image: memory-domain-ops-world:${DOMAIN_OPS_IMAGE_TAG:-local}
  restart: "no"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
    interval: 500ms
    timeout: 300ms
    retries: 30

services:
  ledger:
    <<: *world
    command: ["--role", "ledger"]
    networks: [callback-ledger, data-ops, monitor-data]

  callback-east:
    <<: *world
    command: ["--role", "callback", "--ledger-url", "http://ledger:8080", "--latency", "300ms"]
    depends_on:
      ledger: {condition: service_healthy}
    networks: [payment-callback, callback-ledger, platform-ops]

  callback-west:
    <<: *world
    command: ["--role", "callback", "--ledger-url", "http://ledger:8080", "--latency", "5ms"]
    depends_on:
      ledger: {condition: service_healthy}
    networks: [payment-callback, callback-ledger, platform-ops]

  payment-east:
    <<: *world
    command:
      - --role
      - payment
      - --callback-url
      - http://callback-east:8080
      - --timeout
      - 100ms
      - --stable-keys=false
      - --retries
      - "2"
    depends_on:
      callback-east: {condition: service_healthy}
    networks: [gateway-payment, payment-callback, payment-ops]

  payment-west:
    <<: *world
    command:
      - --role
      - payment
      - --callback-url
      - http://callback-west:8080
      - --timeout
      - 500ms
      - --stable-keys=true
      - --retries
      - "2"
    depends_on:
      callback-west: {condition: service_healthy}
    networks: [gateway-payment, payment-callback, payment-ops]

  gateway:
    <<: *world
    command:
      - --role
      - gateway
      - --east-url
      - http://payment-east:8080
      - --west-url
      - http://payment-west:8080
      - --route
      - east
    depends_on:
      payment-east: {condition: service_healthy}
      payment-west: {condition: service_healthy}
    networks: [checkout-public, gateway-payment, edge-ops, monitor-gateway]

  monitor:
    <<: *world
    command:
      - --role
      - monitor
      - --gateway-url
      - http://gateway:8080
      - --ledger-url
      - http://ledger:8080
    depends_on:
      gateway: {condition: service_healthy}
      ledger: {condition: service_healthy}
    networks: [lead-ops, monitor-gateway, monitor-data]

  load:
    <<: *world
    profiles: [tools]
    entrypoint: ["domain-load"]
    command:
      - --gateway-url
      - http://gateway:8080
      - --monitor-url
      - http://monitor:8080
    networks: [checkout-public, lead-ops]

  edge-tool:
    <<: *world
    profiles: [tools]
    entrypoint: ["domainctl", "--role", "edge", "--endpoint", "http://gateway:8080"]
    networks: [edge-ops]

  payment-tool:
    <<: *world
    profiles: [tools]
    entrypoint: ["domainctl", "--role", "payment"]
    networks: [payment-ops]

  platform-tool:
    <<: *world
    profiles: [tools]
    entrypoint: ["domainctl", "--role", "platform"]
    networks: [platform-ops]

  data-tool:
    <<: *world
    profiles: [tools]
    entrypoint: ["domainctl", "--role", "data", "--endpoint", "http://ledger:8080"]
    networks: [data-ops]

  lead-tool:
    <<: *world
    profiles: [tools]
    entrypoint: ["domainctl", "--role", "lead", "--endpoint", "http://monitor:8080"]
    networks: [lead-ops]

networks:
  checkout-public: {}
  gateway-payment: {internal: true}
  payment-callback: {internal: true}
  callback-ledger: {internal: true}
  monitor-gateway: {internal: true}
  monitor-data: {internal: true}
  lead-ops: {internal: true}
  edge-ops: {internal: true}
  payment-ops: {internal: true}
  platform-ops: {internal: true}
  data-ops: {internal: true}
