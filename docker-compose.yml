services:
  memory:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: JayWanX/memory:${VERSION:-dev}
    env_file:
      - .env
    environment:
      MEMORY_DATA_DIR: /memory
    volumes:
      - memory-data:/memory
    command: ["status"]

  JayWanX:
    build:
      context: .
      target: dev
    profiles:
      - dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      MEMORY_DATA_DIR: /memory
    volumes:
      - .:/workspace
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - memory-data:/memory
    command: ["bash"]

  ollama:
    image: ollama/ollama:latest
    profiles:
      - embeddings
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  memory-data:
  go-build-cache:
  go-mod-cache:
  ollama-data:
