name: Manual Integration

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Integration suite to run
        type: choice
        default: all
        options:
          - all
          - zcode-windows

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: inputs.suite != 'zcode-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run integration suite
        run: make test-integration

  zcode-windows:
    if: inputs.suite == 'all' || inputs.suite == 'zcode-windows'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Windows Memory product
        run: go build -o memory.exe .

      - name: Test installed ZCode hooks in Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:MEMORY_TEST_BIN = (Resolve-Path ./memory.exe).Path
          go test ./test/memory/zcode -v -count=1
