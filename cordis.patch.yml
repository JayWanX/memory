# Mount the full @jaywanx/dsh-memory package selected by its npm latest tag in
# package.json. Keeping the plugin's own core row id (dsh-memory) as the mounted
# row preserves its host and browser plugin identities.
- insert:
    - id: dsh-memory
      name: "@jaywanx/dsh-memory"
      config:
        routingGuidance: true
        lifecycleEnabled: true
        recallMode: guided
        writebackMode: guided
        idleReviewMs: 30000
        tabEnabled: true
        writeEnabled: true
        timeoutMs: 10000
        defaultRecallLimit: 10
